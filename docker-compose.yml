services:
  proxmox-mcp:
    build: .
    container_name: proxmox-mcp
    ports:
      - "${MCP_PORT}:3000"
    volumes:
      # Proxmox cluster CA (copied from /etc/pve/pve-root-ca.pem) so the API
      # certificate can be verified.
      - ./secrets/pve-root-ca.pem:/secrets/pve-root-ca.pem:ro
    # Untracked secrets (PROXMOX_TOKEN_SECRET, MCP_AUTH_TOKEN). Values listed under
    # `environment` take precedence, so secrets are deliberately not there.
    env_file:
      - path: .env.local
        required: false
    environment:
      PROXMOX_HOST: ${PROXMOX_HOST}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID}
      PROXMOX_CA_CERT: /secrets/pve-root-ca.pem
      PROXMOX_TLS_INSECURE: ${PROXMOX_TLS_INSECURE:-false}
      PROXMOX_NODE: ${PROXMOX_NODE:-pve}
      PROXMOX_NO_MIGRATE_TAG: ${PROXMOX_NO_MIGRATE_TAG:-}
    restart: unless-stopped
